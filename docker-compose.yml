# Entorno de desarrollo LOCAL 

services:
  app:
    build: .
    container_name: retobbva-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8088:8088"

  postgres:
    image: postgres:15-alpine
    container_name: retobbva-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a docker compose down.
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      # Lo consume el depends_on del servicio app
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  datos-postgres:
