# Entorno de desarrollo LOCAL
# Las variables van con prefijo RETO_ para no chocar con las que ya tenga
# definidas la maquina host, que Compose prioriza sobre el .env.

services:
  app:
    build: .
    container_name: retobbva-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${RETO_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${RETO_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RETO_DB_PASSWORD}
    ports:
      - "8088:8088"

  postgres:
    image: postgres:15-alpine
    container_name: retobbva-postgres
    environment:
      POSTGRES_DB: ${RETO_DB_NAME}
      POSTGRES_USER: ${RETO_DB_USER}
      POSTGRES_PASSWORD: ${RETO_DB_PASSWORD}
    ports:
      - "${RETO_DB_PORT}:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a docker compose down.
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      # Lo consume el depends_on del servicio app
      test: ["CMD-SHELL", "pg_isready -U ${RETO_DB_USER} -d ${RETO_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  datos-postgres:
